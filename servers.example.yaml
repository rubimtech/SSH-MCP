# ─────────────────────────────────────────────────────────────────────────────
# servers.example.yaml — образец конфигурации ssh-mcp.
#
# Скопируй под именем servers.yaml и заполни своими хостами:
#     cp servers.example.yaml servers.yaml
# Реальный servers.yaml обычно коммитится (секретов в нём быть не должно —
# только ссылки ${ПЕРЕМЕННАЯ}), но known_hosts и audit.jsonl рядом с ним
# игнорируются.
#
# Что где:
#   defaults        — значения по умолчанию для всех серверов ниже;
#   settings        — поведение самого MCP (папки, сервер по умолчанию);
#   servers         — сами хосты;
#   default: true   — сервер, который использует вызов без аргумента server.
#
# Строки `#` НАД именем сервера попадают в поле comments и показываются агенту
# в ssh_list_servers / ssh_server_info. Это его карта местности: пишите туда
# всё, по чему агент отличит одну машину от другой, — и что делать с ней.
#
# ВНИМАНИЕ: CHANGE_ME — это заглушка, чтобы файл открывался без .env.
# Перед первым настоящим подключением замените её на ${ПЕРЕМЕННАЯ} без
# значения по умолчанию: пустой пароль конфигурация не примет, а CHANGE_ME
# на реальном хосте — это неверный пароль, а не защита.
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  port: 22
  username: root
  connect_timeout: 30
  auth_timeout: 30

  # Доверие к host-key:
  #   auto_add — TOFU: первый увиденный ключ записывается в known_hosts
  #              рядом с этим файлом и дальше сверяется;
  #   reject   — ключ обязан уже быть в known_hosts, иначе отказ (без TOFU);
  #   pin      — сверять только с host_key_fingerprint из профиля; смена ключа
  #              ломает соединение намеренно.
  host_key_policy: auto_add

  # Пинг каждые N секунд: NAT и прокси рвут молчащее соединение, а обрыв выглядит
  # как зависшая команда. 30 — разумный компромисс.
  keepalive_interval: 30

settings:
  # Какие локальные папки доступны ssh_upload_file / ssh_download_file.
  # Пустой список = доступ к любому локальному пути (не рекомендуется).
  # Дополнительные папки можно задать переменной SSH_ALLOWED_LOCAL_DIRS.
  allowed_local_dirs:
    - D:/Work

  # Сервер по умолчанию для вызовов без аргумента server.
  default_server: example-host


servers:

  # ── Обычный сервер с паролем ───────────────────────────────────────────────
  # Прод-сервер: docker-compose стек в /opt/app. Деплой одной командой,
  # сборка занимает несколько минут — запускай через nohup с логом в /tmp,
  # не держи SSH-вызов открытым. Перед всем — /usr/local/sbin/app-backup.
  example-host:
    host: 203.0.113.10
    default_workdir: /opt/app
    description: Продакшн приложения (docker compose, /opt/app)
    tags: [prod, docker, deploy]
    default: true
    auth:
      type: password
      # Значение по умолчанию нужно, чтобы конфиг грузился без .env;
      # в рабочем файле оставь только ${ПЕРЕМЕННАЮ} без значения по умолчанию.
      password: ${PROD_PASSWORD:-CHANGE_ME}

  # ── Внутренний хост за NAT, только через jump-host ─────────────────────────
  # Прямого доступа из интернета нет: соединение идёт через example-host.
  # Локальные сервисы (postgres, admin) сюда не пробросить — только exec и SFTP.
  example-internal:
    host: 198.51.100.20
    jump_via: example-host
    description: Внутренний хост за NAT, только через jump-host
    tags: [internal, jump]
    auth:
      type: password
      password: ${INTERNAL_PASSWORD:-CHANGE_ME}

  # ── Аутентификация по ключу ───────────────────────────────────────────────
  # Ключ лежит на локальной машине, поэтому путь приходит из .env.
  # Парольную фразу (auth.passphrase) держи в .env, не в этом файле.
  # Если ключ не сработал, соединение падает на agent, затем на пароль —
  # все неудачные попытки перечисляются в тексте ошибки.
  example-keyauth:
    host: 203.0.113.30
    description: Хост с доступом по ключу
    tags: [keyauth]
    auth:
      type: key
      key_path: ${DEPLOY_KEY:-~/.ssh/id_ed25519}
      passphrase: ${DEPLOY_KEY_PASSPHRASE:-CHANGE_ME}
      # Не откатываться на пароль, если ключ не подошёл.
      password_fallback: false

  # ── Нестандартный порт ─────────────────────────────────────────────────────
  # Имя хоста для сверки ключа приводится к [host]:port, поэтому запись находится
  # всегда; собственный known_hosts пользователя при этом не трогаем.
  example-nonstandard-port:
    host: 203.0.113.40
    port: 2222
    description: Хост на нестандартном порту
    tags: [pinned]
    auth:
      type: password
      password: ${PINNED_PASSWORD:-CHANGE_ME}

  # ── Жёсткая привязка к отпечатку ключа (pin) ──────────────────────────────
  # Отпечаток нельзя выдумать: конфигурация проверяет формат и сравнивает его при
  # каждом подключении. Порядок действий:
  #   1. подключиться один раз с host_key_policy: auto_add;
  #   2. посмотреть отпечаток в выводе ssh_server_info (поле host_key_fingerprint);
  #   3. вписать его в host_key_fingerprint и переключить политику на pin —
  #      с этого момента смена ключа на хосте рвёт соединение, а не проходит молча.
  # Формат — как у `ssh-keygen -lf`: SHA256: + 43 символа base64 без '='.
  #
  # example-pinned:
  #   host: 203.0.113.40
  #   host_key_policy: pin
  #   host_key_fingerprint: ${PINNED_FINGERPRINT}
  #   auth:
  #     type: password
  #     password: ${PINNED_PASSWORD}